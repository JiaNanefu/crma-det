# Clean RT-DETR common setup for final CRMA-Det experiments on CaryaData.
# This base intentionally keeps only the baseline RT-DETR-R18vd path plus
# shared data, optimizer, scheduler, EMA, AMP, and evaluation settings.

task: detection
model: RTDETR
postprocessor: RTDETRPostProcessor
use_focal_loss: true

num_classes: 4
remap_mscoco_category: False

sync_bn: True
find_unused_parameters: False
use_amp: True
scaler:
  type: GradScaler
  enabled: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/images/train
    ann_file: ./dataset/annotations/train.json
    ignore_category_ids: [4]
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: ToImageTensor}
        - {type: ConvertDtype, dtype: float32, scale: True}
        - {type: ConvertBox, out_fmt: cxcywh, normalize: True}
  shuffle: True
  batch_size: 8
  num_workers: 4
  drop_last: True
  collate_fn: default_collate_fn

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/images/val
    ann_file: ./dataset/annotations/val.json
    ignore_category_ids: [4]
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ToImageTensor}
        - {type: ConvertDtype, dtype: float32, scale: True}
        - {type: ConvertBox, out_fmt: cxcywh, normalize: True}
  shuffle: False
  batch_size: 8
  num_workers: 4
  drop_last: False
  collate_fn: default_collate_fn

test_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/images/test
    ann_file: ./dataset/annotations/test.json
    ignore_category_ids: [4]
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ToImageTensor}
        - {type: ConvertDtype, dtype: float32, scale: True}
        - {type: ConvertBox, out_fmt: cxcywh, normalize: True}
  shuffle: False
  batch_size: 8
  num_workers: 4
  drop_last: False
  collate_fn: default_collate_fn

RTDETR:
  encoder: HybridEncoder
  backbone: PResNet
  decoder: RTDETRTransformer
  multi_scale: [480, 512, 544, 576, 608, 640, 640, 640]

PResNet:
  depth: 18
  variant: d
  freeze_at: -1
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: false
  pretrained: false

HybridEncoder:
  in_channels: [128, 256, 512]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  pe_temperature: 10000
  expansion: 0.5
  depth_mult: 1.0
  act: silu
  eval_spatial_size: [640, 640]

RTDETRTransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_queries: 300
  num_decoder_points: 4
  nhead: 8
  num_decoder_layers: 3
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learnt_init_query: false
  eval_idx: -1
  eval_spatial_size: [640, 640]
  aux_loss: true

RTDETRPostProcessor:
  num_top_queries: 300

criterion: SetCriterion
SetCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2}
  losses: [vfl, boxes]
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00005
      weight_decay: 0.0
    - params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00005
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.0
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLRWarmup
  milestones: [120]
  warmup_epochs: 5
  gamma: 0.1

epoches: 150
early_stopping_patience: 999
clip_max_norm: 0.1
