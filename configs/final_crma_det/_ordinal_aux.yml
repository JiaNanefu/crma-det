# Cumulative ordinal auxiliary supervision used by the final model.

ordinal_num_classes: 4
ordinal_ignore_labels: [4]

criterion: DualBranchMaturityLoss

RTDETR:
  decoder: DualBranchMaturityHead

DualBranchMaturityHead:
  num_classes: 4
  ordinal_num_classes: 4
  hidden_dim: 256
  num_queries: 300
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  num_levels: 3
  num_decoder_points: 4
  nhead: 8
  num_decoder_layers: 3
  dim_feedforward: 1024
  dropout: 0.0
  activation: silu
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learnt_init_query: false
  eval_spatial_size: [640, 640]
  eval_idx: -1
  aux_loss: true
  use_ordinal: true
  use_ordinal_branch: true
  ordinal_branch_type: cumulative
  num_ordinal_logits: 3

DualBranchMaturityLoss:
  num_classes: 4
  ordinal_num_classes: 4
  ordinal_ignore_labels: [4]
  use_ordinal: false
  use_fdr: false
  use_ordinal_branch: true
  apply_dn_ordinal: false
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_ord_branch: 0.8
  losses: [vfl, boxes, ord_branch]
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
